<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">MSHpit community mark</title>
  <desc id="desc">A circle of concert fans gathered around a shared center.</desc>
  <defs>
    <g id="person" fill="#ffffff">
      <circle cx="0" cy="-18" r="10"/>
      <path d="M-19 17C-19 1-11-9 0-9S19 1 19 17C7 13-7 13-19 17Z"/>
    </g>
  </defs>

  <g transform="translate(128 128)">
    <use href="#person" transform="translate(0 -70)"/>
    <use href="#person" transform="rotate(45) translate(0 -70)"/>
    <use href="#person" transform="rotate(90) translate(0 -70)"/>
    <use href="#person" transform="rotate(135) translate(0 -70)"/>
    <use href="#person" transform="rotate(180) translate(0 -70)"/>
    <use href="#person" transform="rotate(225) translate(0 -70)"/>
    <use href="#person" transform="rotate(270) translate(0 -70)"/>
    <use href="#person" transform="rotate(315) translate(0 -70)"/>
  </g>
</svg>
