<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">MSHpit community mark</title>
  <desc id="desc">A circle of concert fans gathered around a shared center.</desc>
  <defs>
    <g id="outer-person" fill="#ffffff">
      <circle cx="0" cy="-44" r="24"/>
      <path d="M-50 44C-49 6-28-16 0-16S49 6 50 44C19 35-19 35-50 44Z"/>
    </g>
    <g id="inner-person" fill="#ffffff">
      <circle cx="0" cy="-35" r="19"/>
      <path d="M-40 35C-39 5-22-13 0-13S39 5 40 35C15 28-15 28-40 35Z"/>
    </g>
  </defs>

  <g transform="translate(512 512)">
    <use href="#outer-person" transform="translate(0 -350)"/>
    <use href="#outer-person" transform="rotate(30) translate(0 -350)"/>
    <use href="#outer-person" transform="rotate(60) translate(0 -350)"/>
    <use href="#outer-person" transform="rotate(90) translate(0 -350)"/>
    <use href="#outer-person" transform="rotate(120) translate(0 -350)"/>
    <use href="#outer-person" transform="rotate(150) translate(0 -350)"/>
    <use href="#outer-person" transform="rotate(180) translate(0 -350)"/>
    <use href="#outer-person" transform="rotate(210) translate(0 -350)"/>
    <use href="#outer-person" transform="rotate(240) translate(0 -350)"/>
    <use href="#outer-person" transform="rotate(270) translate(0 -350)"/>
    <use href="#outer-person" transform="rotate(300) translate(0 -350)"/>
    <use href="#outer-person" transform="rotate(330) translate(0 -350)"/>

    <use href="#inner-person" transform="translate(0 -190)"/>
    <use href="#inner-person" transform="rotate(45) translate(0 -190)"/>
    <use href="#inner-person" transform="rotate(90) translate(0 -190)"/>
    <use href="#inner-person" transform="rotate(135) translate(0 -190)"/>
    <use href="#inner-person" transform="rotate(180) translate(0 -190)"/>
    <use href="#inner-person" transform="rotate(225) translate(0 -190)"/>
    <use href="#inner-person" transform="rotate(270) translate(0 -190)"/>
    <use href="#inner-person" transform="rotate(315) translate(0 -190)"/>
  </g>
</svg>
