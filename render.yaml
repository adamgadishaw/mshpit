# Render Blueprint — one-click deploy of mshpit.com.
# In Render: New ▸ Blueprint ▸ pick this repo. It provisions the web service,
# a PERSISTENT DISK for the SQLite DB (critical — without it the database is
# wiped on every deploy), Node 24, and the production env. Set ADMIN_EMAIL and
# ADMIN_PASSWORD when prompted (both are sync:false so neither is stored in git).
services:
  - type: web
    name: mshpit
    runtime: node
    plan: starter                      # $7/mo; has persistent disk support
    # The persistent disk is not mounted during builds. Give the quality gate a
    # throwaway, explicitly bootstrapped database; these command-scoped values do
    # not reach the runtime process or weaken the /data startup guard. The live
    # npm advisory query remains in GitHub CI; a registry outage must not make an
    # already-audited production artifact undeployable.
    buildCommand: npm ci && mkdir -p /tmp/pit-build-data && PIT_DATA_DIR=/tmp/pit-build-data PIT_ALLOW_EMPTY_DB_BOOTSTRAP=true npm run check:deploy
    # The runtime disk is finally mounted here. Snapshot + verify the existing
    # database before importing db.js applies this release's migrations; a
    # failed snapshot stops startup before migration (persistent-disk deploys
    # can be unavailable until the operator fixes the backup or rolls back).
    startCommand: node scripts/start-production.mjs
    # Keep general liveness available to members, but do not promote a release
    # whose explicitly enabled video pipeline has not completed its signed
    # verifier and private-storage readiness proofs yet.
    healthCheckPath: /api/readiness
    autoDeploy: true
    disk:
      name: pit-data
      mountPath: /data                 # PIT_DATA_DIR points here → pit.db survives deploys
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Explicit, non-secret authority for the bounded five-object maintenance
      # release. Staging intentionally omits this even if somebody mispoints its
      # storage settings at production.
      - key: PIT_LEGACY_VIDEO_POSTER_RELEASE
        value: 2026-08-22-v1
      - key: PIT_DATA_DIR
        value: /data
      - key: PIT_ALLOW_EMPTY_DB_BOOTSTRAP
        value: "false"                 # one-time first boot only; never leave enabled
      # Daily verified snapshots stay under /data/backups (7 retained). Dedicated
      # private S3/R2 credentials additionally copy each snapshot off-host; never
      # reuse the public MEDIA_BUCKET for database backups. BACKUP_KEEP controls
      # local files only: configure and evidence a provider lifecycle rule on the
      # private bucket that matches the counsel-approved backup retention period.
      - key: BACKUP_ENABLED
        value: "true"
      - key: BACKUP_KEEP
        value: "7"
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: PUBLIC_ORIGIN
        value: https://www.mshpit.com
      # Set this to the same address as ADMIN_EMAIL for the one-way Owner
      # identity migration. The database-locked Owner becomes authoritative.
      - key: OWNER_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false                    # enter the administrator identity in Render
      - key: OWNER_MIGRATION_EMAIL
        sync: false                    # one-time v1 -> locked Owner approval; must match OWNER_EMAIL
      - key: ADMIN_PASSWORD
        sync: false                    # you enter this in the Render dashboard
      # Operational alerts are separate from the bootstrap root identity. Point
      # this at a monitored Workspace inbox without changing ADMIN_EMAIL.
      - key: ALERT_EMAIL
        sync: false
      # Privacy-safe aggregate readout. Durable app_meta claims suppress
      # duplicates across restarts and rolling deploys.
      - key: SITE_HEALTH_DIGEST_ENABLED
        value: "true"
      - key: SITE_HEALTH_DIGEST_HOUR
        value: "9"                    # America/Toronto
      # In-app playback resolves each song to a YouTube video via the YouTube Data
      # API and caches the id in SQLite within the reviewed 30-day provider-data
      # ceiling (the free quota is ~100 searches/day,
      # so the cache fills gradually — top artists first). Get a key at
      # console.cloud.google.com → enable "YouTube Data API v3" → Credentials → API
      # key. Without it, playback falls back to Deezer 30s previews for everyone.
      - key: YOUTUBE_API_KEY
        sync: false
      # Keep provider fan-out out of the web process during incident recovery.
      # Re-enable deliberately only after /api/health stays stable through a
      # cold start and the service has durable storage/headroom.
      - key: CACHE_WARM_ENABLED
        value: "false"
      # Password recovery is disabled gracefully until both values are set. Never
      # log or expose reset links as a substitute for transactional email.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false                    # monitored Google Workspace inbox/alias
      # Fail closed after database restore: old snapshots may predate consent
      # withdrawals or deletion. Enable only after the privacy replay/drill.
      - key: EMAIL_CAMPAIGN_RECOVERY_ENABLED
        value: "false"
      # Durable photos upload directly to an S3-compatible bucket using a
      # short-lived signed PUT. The same active-media credential must be limited
      # to this bucket and permit PutObject, DeleteObject, and ListBucket: account
      # cleanup deletes ledger keys and performs an exact users/{owner}/ legacy
      # sweep. Keep credentials server-side; MEDIA_PUBLIC_BASE_URL is the
      # CDN/public bucket base where an uploaded object key is readable.
      # Example R2 endpoint: https://<account-id>.r2.cloudflarestorage.com
      - key: MEDIA_ENDPOINT
        sync: false
      - key: MEDIA_BUCKET
        sync: false
      # Private clip originals. Must be distinct from MEDIA_BUCKET and have no
      # public custom domain; only sanitized derivatives enter MEDIA_BUCKET.
      - key: MEDIA_SOURCE_BUCKET
        sync: false
      - key: MEDIA_REGION
        sync: false
      - key: MEDIA_ACCESS_KEY_ID
        sync: false
      - key: MEDIA_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_PUBLIC_BASE_URL
        sync: false
      - key: PIT_VIDEO_PUBLISHING_ENABLED
        value: "true"
      # Blueprint owns both references. Reconciliation can safely be retried
      # after the private service's first deployment establishes the source.
      - key: PIT_VIDEO_VERIFIER_HOSTPORT
        fromService:
          type: pserv
          name: pit-video-verifier
          property: hostport
      - key: PIT_VIDEO_VERIFIER_SECRET
        fromService:
          type: pserv
          name: pit-video-verifier
          envVarKey: PIT_VIDEO_VERIFIER_SECRET
      - key: MEDIA_CLEANUP_ENABLED
        value: "true"
      - key: MEDIA_LEGACY_RECOVERY_ENABLED
        value: "true"
      - key: MEDIA_ORPHAN_TTL_MS
        value: "604800000"             # 7 days; code bounds this to 1-30 days
      # These are high emergency abuse ceilings, not member upload-plan caps.
      # They keep a compromised account from minting unbounded storage
      # capabilities while staying far above ordinary creator use.
      - key: MEDIA_UPLOAD_OUTSTANDING_OBJECTS
        value: "256"
      - key: MEDIA_UPLOAD_OUTSTANDING_BYTES
        value: "34359738368"            # 32 GiB: above one max 20-clip source + delivery composition
      - key: MEDIA_UPLOAD_24H_BYTES
        value: "68719476736"            # 64 GiB of upload tickets per member
      - key: MEDIA_UPLOAD_24H_TICKETS
        value: "4096"
      # Service-wide incident circuit breakers. These are intentionally far
      # above member-scale use and are not upload-plan limits.
      - key: MEDIA_UPLOAD_GLOBAL_OUTSTANDING_OBJECTS
        value: "100000"
      - key: MEDIA_UPLOAD_GLOBAL_OUTSTANDING_BYTES
        value: "2199023255552"          # 2 TiB unfinished across the service
      - key: MEDIA_UPLOAD_GLOBAL_24H_BYTES
        value: "8796093022208"          # 8 TiB of tickets across the service
      - key: MEDIA_UPLOAD_GLOBAL_24H_TICKETS
        value: "1000000"
      - key: EXPO_PUBLIC_GOOGLE_MAPS_KEY
        # Referrer-locked (mshpit.com/*) + Maps Static API only. Safe to commit:
        # EXPO_PUBLIC_* vars are inlined into the public web bundle on every build,
        # so this key is shipped to every visitor regardless — sync:false only made
        # deploys silently fall back to the drawn map when the dashboard was blank.
        value: AIzaSyBbH03hTjAwT603T0pWew-2L9aaBVlGFXw
      # Tour dates are scraped IN-PROCESS into SQLite (server/tourdates.js) on a
      # timer and served via GET /api/tourdates — no cron, no git push, no redeploy.
      # Set these (at least one) in the dashboard to turn scraping on.
      - key: TICKETMASTER_KEY
        sync: false                    # free: developer.ticketmaster.com (Consumer Key only)
      - key: BANDSINTOWN_APP_ID
        sync: false                    # self-assigned string; developer.bandsintown.com
      - key: TOURDATE_REFRESH_ENABLED
        value: "true"                  # production owns the quota-safe worldwide refresh
      - key: TOURDATE_DEMAND_REFRESH_ENABLED
        value: "true"                  # exact signed-in artist lookups enqueue a durable background refresh
      - key: TOURDATE_DEMAND_QUEUE_LIMIT
        value: "128"                   # service-wide pending work, never a per-member content limit
      - key: TOURDATE_DEMAND_HOURLY_LIMIT
        value: "12"                    # leaves headroom for scheduled market coverage
      - key: TOURDATE_LIMIT
        value: "150"                   # fixed provider budget: priority demand plus a rotating catalogue slice
      - key: TOURDATE_ROTATION_SIZE
        value: "100"                   # 100 new catalogue artists per pass; the other 50 stay demand-led
      - key: TOURDATE_ARTIST_PAGE_SIZE
        value: "200"                   # provider maximum in the same single request
      - key: TOURDATE_COUNTRY_BATCH
        value: "10"                    # persisted round-robin global markets per pass
      - key: TOURDATE_REQUEST_DELAY_MS
        value: "550"                   # conservative Ticketmaster pacing
      - key: TOURDATE_REFRESH_H
        value: "12"                    # hours between refreshes
      - key: TOURDATE_CITY_LIMIT
        value: "50"                    # most-used member cities refreshed per pass

  # Originals never enter the feed directly. This private service performs the
  # authoritative full decode, strips container metadata, writes a sanitized
  # MP4 derivative plus JPEG cover, and has no storage/database credentials.
  # Its only storage authority is the short-lived, object-bound URLs signed by
  # the web service. A pinned Node image plus a startup decoder probe makes an
  # FFmpeg/runtime change fail closed instead of silently changing acceptance.
  - type: pserv
    name: pit-video-verifier
    runtime: docker
    # Video normalization is CPU/memory work, not ordinary request serving.
    # Standard provides 1 CPU / 2 GiB so bounded iPhone HEVC clips do not starve
    # or OOM the verifier's single isolated slot.
    plan: standard
    region: oregon
    branch: master
    dockerfilePath: ./Dockerfile.video-verifier
    dockerContext: .
    autoDeploy: true
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PORT
        value: "10001"
      - key: PIT_VIDEO_VERIFIER_SECRET
        generateValue: true
      - key: PIT_VIDEO_SOURCE_ORIGIN
        fromService:
          type: web
          name: mshpit
          envVarKey: MEDIA_ENDPOINT
      - key: PIT_VIDEO_SOURCE_BUCKET
        fromService:
          type: web
          name: mshpit
          envVarKey: MEDIA_SOURCE_BUCKET
      - key: PIT_VIDEO_OUTPUT_ORIGIN
        fromService:
          type: web
          name: mshpit
          envVarKey: MEDIA_ENDPOINT
      - key: PIT_VIDEO_OUTPUT_BUCKET
        fromService:
          type: web
          name: mshpit
          envVarKey: MEDIA_BUCKET
      - key: PIT_FFMPEG_PATH
        value: /opt/ffmpeg/bin/ffmpeg
      - key: PIT_FFPROBE_PATH
        value: /opt/ffmpeg/bin/ffprobe

  # ---------------------------------------------------------------------------
  # STAGING. Deploys from the `staging` branch so `master` stops being both the
  # integration and the production environment. Merge to `staging` first, watch
  # it, then fast-forward `master`.
  #
  # Staging runs NODE_ENV=production on purpose: with NODE_ENV=development the
  # cookie loses Secure, CORS opens to the dev allowlist, and the data-directory
  # guard changes behaviour — at which point it is no longer a rehearsal. The
  # deployment identity is carried by PIT_ENV instead, which drives:
  #   - email: delivery is restricted to EMAIL_ALLOWED_RECIPIENTS and fails
  #     CLOSED, so an unset allowlist sends nothing (see server/emailService.js)
  #   - robots.txt: Disallow: / so staging is never indexed
  #
  # THREE THINGS MUST BE DIFFERENT FROM PRODUCTION, set in the dashboard:
  #   1. MEDIA_BUCKET — a separate bucket. Sharing production's means staging
  #      test uploads land in the bucket real users' photos are served from.
  #   2. RESEND_API_KEY — ideally a separate key so staging sends are
  #      attributable, and its own quota cannot eat production's.
  #   3. ADMIN_PASSWORD — never reuse production's.
  - type: web
    name: mshpit-staging
    runtime: node
    plan: starter
    branch: staging
    buildCommand: npm ci && mkdir -p /tmp/pit-build-data && PIT_DATA_DIR=/tmp/pit-build-data PIT_ALLOW_EMPTY_DB_BOOTSTRAP=true npm run check:deploy
    startCommand: node scripts/start-production.mjs
    healthCheckPath: /api/readiness
    autoDeploy: true
    disk:
      name: pit-staging-data           # a DIFFERENT disk; never point at pit-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production              # see note above — deliberate
      - key: PIT_ENV
        value: staging                 # the isolation switch
      - key: PIT_DATA_DIR
        value: /data
      # Fail closed by default. For a genuinely new disk, change this to true for
      # one dashboard deployment only, confirm pit.db exists, then restore false.
      - key: PIT_ALLOW_EMPTY_DB_BOOTSTRAP
        value: "false"
      - key: BACKUP_ENABLED
        value: "true"
      - key: BACKUP_KEEP
        value: "7"
      # Use a private staging backup bucket if off-host copies are configured.
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_REGION
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false                    # the onrender.com URL Render assigns
      - key: OWNER_EMAIL
        sync: false                    # if set, must match staging ADMIN_EMAIL
      - key: ADMIN_EMAIL
        sync: false                    # configure staging independently in Render
      - key: OWNER_MIGRATION_EMAIL
        sync: false                    # staging migration must be independent
      - key: ADMIN_PASSWORD
        sync: false                    # must NOT match production
      - key: ALERT_EMAIL
        sync: false
      - key: SITE_HEALTH_DIGEST_ENABLED
        value: "false"                # never mail production operations from staging
      - key: SITE_HEALTH_DIGEST_HOUR
        value: "9"
      # Comma-separated. Anything not listed is logged as skipped, never sent.
      # Empty means staging sends no email at all, which is the safe default.
      - key: EMAIL_ALLOWED_RECIPIENTS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
      - key: EMAIL_CAMPAIGN_RECOVERY_ENABLED
        value: "false"
      - key: MEDIA_ENDPOINT
        sync: false
      - key: MEDIA_BUCKET
        sync: false                    # a SEPARATE bucket from production
      - key: MEDIA_SOURCE_BUCKET
        sync: false                    # a SEPARATE private source bucket
      - key: MEDIA_REGION
        sync: false
      - key: MEDIA_ACCESS_KEY_ID
        sync: false
      - key: MEDIA_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_PUBLIC_BASE_URL
        sync: false
      - key: PIT_VIDEO_PUBLISHING_ENABLED
        value: "false"
      - key: PIT_VIDEO_VERIFIER_HOSTPORT
        sync: false
      - key: PIT_VIDEO_VERIFIER_SECRET
        sync: false
      - key: MEDIA_CLEANUP_ENABLED
        value: "true"
      - key: MEDIA_LEGACY_RECOVERY_ENABLED
        value: "true"
      - key: MEDIA_ORPHAN_TTL_MS
        value: "604800000"
      - key: MEDIA_UPLOAD_OUTSTANDING_OBJECTS
        value: "256"
      - key: MEDIA_UPLOAD_OUTSTANDING_BYTES
        value: "34359738368"
      - key: MEDIA_UPLOAD_24H_BYTES
        value: "68719476736"
      - key: MEDIA_UPLOAD_24H_TICKETS
        value: "4096"
      - key: MEDIA_UPLOAD_GLOBAL_OUTSTANDING_OBJECTS
        value: "100000"
      - key: MEDIA_UPLOAD_GLOBAL_OUTSTANDING_BYTES
        value: "2199023255552"
      - key: MEDIA_UPLOAD_GLOBAL_24H_BYTES
        value: "8796093022208"
      - key: MEDIA_UPLOAD_GLOBAL_24H_TICKETS
        value: "1000000"
      # Provider fan-out stays off on staging: it would burn production's shared
      # YouTube and Ticketmaster quotas for data nobody looks at.
      - key: CACHE_WARM_ENABLED
        value: "false"
      - key: TOURDATE_REFRESH_ENABLED
        value: "false"
      - key: TOURDATE_DEMAND_REFRESH_ENABLED
        value: "false"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: TICKETMASTER_KEY
        sync: false
      - key: EXPO_PUBLIC_GOOGLE_MAPS_KEY
        sync: false

  # NOTE: the old git-push cron ("pit-catalog-refresh") is retired — the in-process
  # scheduler above replaces it for tour dates (no token, no redeploy, live instantly).
  # To grow the ARTIST roster (a bundled file), run `npm run pipeline` locally and
  # push, or re-add a cron later if you want it automated.
