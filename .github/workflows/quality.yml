name: Quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party action tags are movable. Pin reviewed, signed releases by
      # immutable commit so a retag cannot inject code into the build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install with Render production dependency settings
        run: npm ci
        env:
          NODE_ENV: production
          NPM_CONFIG_INCLUDE: dev
      - name: Validate Render Blueprint before deployment
        run: npm run check:blueprint
      - run: npm run check
      # Render passes runtime flags into its build. Exercise that boundary too:
      # a passing local-default suite must not hide a hosted-only failure.
      # The test runner still owns throwaway storage and strips mail credentials.
      - name: Test with hosted background settings
        run: npm test
        env:
          NODE_ENV: production
          PIT_ENV: production
          RENDER: "true"
          CACHE_WARM_ENABLED: "false"
          TOURDATE_REFRESH_ENABLED: "true"
          EMAIL_CAMPAIGN_RECOVERY_ENABLED: "false"
          PIT_ALLOW_EMPTY_DB_BOOTSTRAP: "true"

  browser-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
        # Inert fixture only. Every map request is intercepted on loopback;
        # no provider key, billing account, or production network is involved.
        env:
          EXPO_PUBLIC_GOOGLE_MAPS_KEY: fixture-only
      # Match the locally verified browser runtime without adding a production
      # dependency, modifying the lockfile, or installing unpinned CLI code.
      - name: Install pinned browser test runtime
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install Chromium and runner dependencies
        run: node node_modules/playwright/cli.js install --with-deps chromium
      # These suites serve the exported bundle on loopback and intercept every
      # API. They need no secrets, database, production URL, or real accounts.
      - run: npm run verify:auth-browser
      - run: npm run verify:artist-account-browser
      - run: npm run verify:artist-identity-moderation-browser
      - run: npm run verify:navigation-browser
      - run: npm run verify:news-browser
      - name: Verify news category corrections (isolated fixtures)
        run: node scripts/verify-news-category-browser.mjs
      - name: Verify Newsroom import, media recovery and manual publication controls
        run: node scripts/verify-newsroom-import-browser.mjs
      - name: Verify existing Newsroom draft and publish flow
        run: node scripts/verify-newsroom-composer-browser.mjs
      - run: npm run verify:discover-photos-browser
      - run: npm run verify:discover-venues-browser
      - name: Catalog upkeep and editor (mobile and desktop)
        run: npm run verify:catalog-maintenance-browser
      - run: npm run verify:quick-log-browser
      - run: npm run verify:festivals-browser
      - run: npm run verify:discover-events-browser
      - run: npm run verify:media-upload-browser
      - run: npm run verify:player-browser
      - run: npm run verify:connections-browser
      - run: npm run verify:social-browser
      # verify:crew-browser returns here when Crew is switched back on.
