<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the app paint into the safe areas; without it
         iOS letterboxes the page on notched devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Mshpit</title>
    <style id="expo-reset">
      /* iOS Safari resolves `height: 100%` against the LARGE viewport, the one
         with the address bar hidden. Combined with `overflow: hidden` that made
         the app taller than the visible area, so the bottom tab bar sat under
         Safari's toolbar and could not be tapped. `dvh` tracks the viewport as
         the toolbar shows and hides; the `100%` line stays first as the
         fallback for browsers that do not support it. */
      html,
      body {
        height: 100%;
        height: 100dvh;
      }
      body {
        overflow: hidden;
        /* Stop the rubber-band scroll from dragging the whole app around. */
        overscroll-behavior: none;
        /* iOS bumps font sizes in landscape unless this is pinned. */
        -webkit-text-size-adjust: 100%;
      }
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
    </style>
    <style id="mshpit-web-boot-style">
      /* The parser-blocking same-origin helper below is the only thing that
         enables this curtain. With JavaScript disabled or the helper missing,
         the server-injected public document remains visible and readable. */
      html[data-mshpit-web-boot="pending"] body {
        overflow: hidden;
        background: #07090f;
      }
      html[data-mshpit-web-boot="pending"] #root > .seo-document {
        visibility: hidden;
      }
      html[data-mshpit-web-boot="pending"] #root::before {
        content: "MSHPIT";
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(242, 166, 90, 0.1), transparent 20rem),
          #07090f;
        color: #f2a65a;
        font: 900 clamp(1.35rem, 4vw, 2rem) / 1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
        pointer-events: none;
      }
      .mshpit-web-boot-status {
        display: none;
      }
      html[data-mshpit-web-boot="pending"] .mshpit-web-boot-status {
        display: block;
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script src="/mshpit-web-boot-v1.js"></script>
  </head>

  <body>
    <noscript>
      Mshpit's public music pages remain readable here. Enable JavaScript to
      sign in, post concert memories, comment, and use the interactive app.
    </noscript>
    <div class="mshpit-web-boot-status" role="status" aria-live="polite" aria-atomic="true">Loading Mshpit</div>
    <div id="root"></div>
</body>
</html>
